name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: "diagnosis: toy snap is expected to miss, locked at frame 12 / stretch 4.33"
        run: |
          echo "This step is not a physics pass. It is not the compare check."
          echo "It passes only while the known miss is unchanged: first stretch at or above 2 at frame 12, stretch 4.33."
          pnpm diagnose:inflate-snap
        env:
          FORCE_COLOR: "0"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Upload draft preview (pull request only, not Pages)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-mbd-preview
          path: dist
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Honest status
        if: always()
        run: |
          {
            echo "# Lint, tests, and diagnosis lock"
            echo
            echo "These steps can be green while the letter A toy still misses the open Radioss bands."
            echo "That green mark is not a physics pass."
            echo
            echo "The honest physics check is the separate job named **compare:inflate — currently misses (not a physics pass)**."
            echo "That job is red on purpose until the toy dynamics are fixed."
            echo "Do not widen the 2 percent stretch, 5 percent volume, or 5 percent pressure bands."
            echo "Do not change shear modulus or the pressure load."
            echo
            echo "This pull request stays a draft. Do not merge. Do not publish GitHub Pages."
          } >> "$GITHUB_STEP_SUMMARY"

  compare-inflate:
    name: "compare:inflate — currently misses (not a physics pass)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: compare:inflate
        run: pnpm compare:inflate

      - name: Honest status
        if: always()
        run: |
          {
            echo "# This check is red on purpose"
            echo
            echo "The letter A toy currently misses the open Radioss fast-load reference at first stretch of 2 or more:"
            echo
            echo "- stretch relative error about 103.6 percent (limit 2 percent)"
            echo "- volume relative error about 267 percent (limit 5 percent)"
            echo "- pressure relative error about 50 percent (limit 5 percent)"
            echo
            echo "This is the physics check. A red mark here is the honest state until the toy dynamics are fixed."
            echo "Do not widen the bands. Do not change shear modulus or the pressure load."
            echo
            echo "A separate diagnosis step records that the known miss is a snap-through at frame 12, stretch 4.33."
            echo "That diagnosis step is not this compare, and a green diagnosis lock is not a physics pass."
            echo
            echo "This pull request stays a draft. Do not merge. Do not publish GitHub Pages."
          } >> "$GITHUB_STEP_SUMMARY"

  measurement-adyrel:
    name: "measurement: 0–16 ms relaxation (not a gate)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print measurement
        run: |
          echo "MEASUREMENT. Not a physics pass. Does not gate."
          echo "The golden's engine commit 6ac7e7d39847cc1c8abfed73d34651a50d2fc3ba is pinned only to the OpenCourant copy, not the original OpenRadioss tree."
          echo
          cat docs/diag-pr18-openradioss-control/adyrel-measurement-results.md
          echo
          echo "This job always exits 0. It does not count toward a pass."

      - name: Honest status
        if: always()
        run: |
          {
            echo "# MEASUREMENT, not a gate"
            echo
            echo "This job prints the 0–16 ms relaxation measurement. It is not a physics pass."
            echo "It must not turn a red compare:inflate into a green mark."
            echo "Default toy is still the 0.18 peak kill."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Pages
    needs: CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

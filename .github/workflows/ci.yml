name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: "diagnosis: kill-off freeze locked; Themis deck-spread expected to miss"
        run: |
          echo "This step is not a physics pass. It is not the compare check."
          echo "It passes only while the shipped kill-off freeze is unchanged: first stretch at or above 2 at frame 8, stretch 2.105."
          echo "Themis’s surviving-deck spread is the gating bar and is expected to miss."
          pnpm diagnose:inflate-snap
        env:
          FORCE_COLOR: "0"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Upload draft preview (pull request only, not Pages)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-mbd-preview
          path: dist
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Honest status
        if: always()
        run: |
          {
            echo "# Lint, tests, and diagnosis lock"
            echo
            echo "These steps can be green while the letter A toy still misses the open Radioss bands."
            echo "That green mark is not a physics pass."
            echo
            echo "The honest physics check is the separate job named **compare:inflate — Themis deck-spread bar (currently misses)**."
            echo "That job is red on purpose until toy stretch sits inside the surviving-deck spread every 2 ms from 0 to 16 ms."
            echo "Triangle shells are in that spread up to about 11.5 ms. Stretch is validated at the 16 ms freeze and lags the decks earlier in the run."
            echo "Do not widen the 2 percent stretch, 5 percent volume, or 5 percent pressure bands."
            echo "Do not change shear modulus or the pressure load."
            echo
            echo "This pull request stays a draft. Do not merge. Do not publish GitHub Pages."
          } >> "$GITHUB_STEP_SUMMARY"

  compare-inflate:
    name: "compare:inflate — Themis deck-spread bar (currently misses)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: compare:inflate
        run: pnpm compare:inflate

      - name: Honest status
        if: always()
        run: |
          {
            echo "# This check is red on purpose"
            echo
            echo "The letter A toy currently misses Themis’s surviving-deck stretch spread (golden four-node + Ishell 24 + fine re-oriented + triangle shells up to about 11.5 ms) on some loaded frames from 2 to 16 ms."
            echo "Volume and pressure stay on the 5 percent bands. The old 2 percent of golden-max stretch bar is printed, not the gate."
            echo "Stretch is validated at the 16 ms freeze and lags the decks earlier in the run."
            echo
            echo "This is the physics check. A red mark here is the honest state until toy stretch sits inside the deck spread."
            echo "Do not widen the bands. Do not change shear modulus or the pressure load."
            echo
            echo "A separate diagnosis step records the shipped kill-off freeze (frame 8, stretch 2.105) and that Themis’s bar still misses."
            echo "That diagnosis step is not this compare, and a green diagnosis lock is not a physics pass."
            echo
            echo "This pull request stays a draft. Do not merge. Do not publish GitHub Pages."
          } >> "$GITHUB_STEP_SUMMARY"

  measurement-adyrel:
    name: "measurement: 0–16 ms relaxation (not a gate)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print measurement
        run: |
          echo "MEASUREMENT. Not a physics pass. Does not gate."
          echo "The golden's engine commit 6ac7e7d39847cc1c8abfed73d34651a50d2fc3ba is pinned only to the OpenCourant copy, not the original OpenRadioss tree."
          echo
          cat docs/diag-pr18-openradioss-control/adyrel-measurement-results.md
          echo
          echo "This job always exits 0. It does not count toward a pass."

      - name: Honest status
        if: always()
        run: |
          {
            echo "# MEASUREMENT, not a gate"
            echo
            echo "This job prints the 0–16 ms relaxation measurement. It is not a physics pass."
            echo "It must not turn a red compare:inflate into a green mark."
            echo "This measurement was taken when the default was the 0.18 peak kill. Shipped default is now velocity kill off."
          } >> "$GITHUB_STEP_SUMMARY"

  measurement-stretch-diagnostics:
    name: "measurement: stretch diagnostics (not a gate)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print stretch diagnostic rules (and results if present)
        run: |
          echo "MEASUREMENT. Not a physics pass. Does not gate."
          echo "The golden's engine commit 6ac7e7d39847cc1c8abfed73d34651a50d2fc3ba is pinned only to the OpenCourant copy, not the original OpenRadioss tree."
          echo
          cat docs/diag-pr18-openradioss-control/stretch-diagnostics-prediction.md
          echo
          if [ -f docs/diag-pr18-openradioss-control/stretch-diagnostics-results.md ]; then
            cat docs/diag-pr18-openradioss-control/stretch-diagnostics-results.md
          else
            echo "Results not yet written. Rules were committed first."
          fi
          echo
          echo "This job always exits 0. It does not count toward a pass."

      - name: Honest status
        if: always()
        run: |
          {
            echo "# MEASUREMENT, not a gate"
            echo
            echo "This job prints the stretch-diagnostic rules (committed first) and results if they exist."
            echo "It is not a physics pass. It must not turn a red compare:inflate into a green mark."
            echo "Do not apply any time shift to a result. Do not widen any bar."
          } >> "$GITHUB_STEP_SUMMARY"

  measurement-per-step-energy:
    name: "energy: per-step bookkeeping rules (correctness gate on the toy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print per-step energy rules (and results if present)
        run: |
          echo "CORRECTNESS GATE ON THE TOY. Not compare:inflate. Does not widen any bar."
          echo "The golden's engine commit 6ac7e7d39847cc1c8abfed73d34651a50d2fc3ba is pinned only to the OpenCourant copy, not the original OpenRadioss tree."
          echo
          cat docs/diag-pr18-openradioss-control/stretch-per-step-energy-prediction.md
          echo
          if [ -f docs/diag-pr18-openradioss-control/stretch-per-step-energy-results.md ]; then
            cat docs/diag-pr18-openradioss-control/stretch-per-step-energy-results.md
          else
            echo "Results not yet written. Rules were committed first."
          fi
          echo
          echo "This job prints the locked rules. It does not run the solver. It does not count as a compare:inflate pass."

      - name: Honest status
        if: always()
        run: |
          {
            echo "# Per-step energy bookkeeping"
            echo
            echo "This job prints the per-step energy rules (committed first) and results if they exist."
            echo "It is a correctness gate on the toy after the run is recorded. It must not turn a red compare:inflate into a green mark."
            echo "Do not apply any time shift. Do not widen any bar."
          } >> "$GITHUB_STEP_SUMMARY"

  measurement-deck-node-output:
    name: "measurement: deck node-output re-run (not a gate)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print deck node-output plan (and results if present)
        run: |
          echo "MEASUREMENT. Not a physics pass. Does not gate."
          echo "The golden's engine commit 6ac7e7d39847cc1c8abfed73d34651a50d2fc3ba is pinned only to the OpenCourant copy, not the original OpenRadioss tree."
          echo
          cat docs/diag-pr18-openradioss-control/deck-node-output-prediction.md
          echo
          echo "Package pin:"
          cat docs/diag-pr18-openradioss-control/opencourant-linux64-pin.json
          echo
          if [ -f docs/diag-pr18-openradioss-control/deck-node-output-results.md ]; then
            cat docs/diag-pr18-openradioss-control/deck-node-output-results.md
          else
            echo "Results not yet written. Plan was committed first."
          fi
          echo
          echo "This job always exits 0. It does not run the engine. It does not count toward a pass."
          echo "Raw node and animation files are gitignored and are not uploaded."

      - name: Honest status
        if: always()
        run: |
          {
            echo "# MEASUREMENT, not a gate"
            echo
            echo "This job prints the four-deck node-output plan (committed first) and the derived table if it exists."
            echo "It is not a physics pass. It must not turn a red compare:inflate into a green mark."
            echo "Do not apply any time shift to a result. Do not widen any bar."
            echo "Raw VTK/ANIM/T01 files stay out of the repository."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Pages
    needs: CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
